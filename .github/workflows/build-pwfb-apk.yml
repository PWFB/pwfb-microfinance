name: Build PWFB Android APK

on:
  push:
    branches:
      - feat/verified-bank-withdrawal
    paths:
      - "apps/android-wrapper/**"
      - ".github/workflows/build-pwfb-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android wrapper dependencies
        working-directory: apps/android-wrapper
        run: npm install --no-audit --no-fund

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Android project
        working-directory: apps/android-wrapper
        run: npx cap add android

      - name: Sync Capacitor project
        working-directory: apps/android-wrapper
        run: npx cap sync android

      - name: Build APK
        working-directory: apps/android-wrapper/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pwfb-microfinance-android-debug-apk
          path: apps/android-wrapper/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
