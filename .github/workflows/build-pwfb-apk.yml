name: Build PWFB Android APK

on:
  push:
    branches:
      - release/pwfb-cleanup-apk
      - main
    paths:
      - "apps/android-wrapper/**"
      - ".github/workflows/build-pwfb-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android wrapper dependencies
        working-directory: apps/android-wrapper
        run: npm install --no-audit --no-fund

      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Generate Android project
        working-directory: apps/android-wrapper
        run: npx cap add android

      - name: Sync Capacitor project
        working-directory: apps/android-wrapper
        run: npx cap sync android

      - name: Build APK
        working-directory: apps/android-wrapper/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pwfb-microfinance-android-debug-apk
          path: apps/android-wrapper/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
