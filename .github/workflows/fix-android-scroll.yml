name: One-time Android scroll fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'fix(android): disable pull-to-refresh') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Disable Android pull-to-refresh
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android-twa/app/src/main/java/com/pwfb/microfinance/MainActivity.java')
          s = p.read_text()
          old = 'swipeRefresh = new SwipeRefreshLayout(this); swipeRefresh.setLayoutParams(new ViewGroup.LayoutParams(-1, -1)); swipeRefresh.setColorSchemeColors(GREEN, ORANGE);'
          new = 'swipeRefresh = new SwipeRefreshLayout(this); swipeRefresh.setLayoutParams(new ViewGroup.LayoutParams(-1, -1)); swipeRefresh.setEnabled(false); swipeRefresh.setColorSchemeColors(GREEN, ORANGE);'
          if old not in s:
              raise SystemExit('Expected Android scroll setup was not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name 'PWFB Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add android-twa/app/src/main/java/com/pwfb/microfinance/MainActivity.java
          git commit -m 'fix(android): disable pull-to-refresh' || exit 0
          git push
