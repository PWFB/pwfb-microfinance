name: PWFB Android Passkey Compile

on:
  pull_request:
    branches:
      - main
      - staging
    paths:
      - 'android-twa/**'
      - '.github/workflows/pwfb-android-passkey-check.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.13'

jobs:
  compile-android-passkey:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Compile Android customer and passkey bridge
        working-directory: android-twa
        run: gradle --no-daemon :app:compileDebugJavaWithJavac
