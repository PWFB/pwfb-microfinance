name: PWFB Android Release

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-twa/**'
      - '.github/workflows/pwfb-android-release.yml'

permissions:
  contents: write

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.13'

jobs:
  build-and-sign-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Restore signing keystore
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android-twa/pwfb-upload-key.jks
          chmod 600 android-twa/pwfb-upload-key.jks
      - name: Build v1.0.37 signed APK and AAB
        working-directory: android-twa
        run: |
          set -euo pipefail
          gradle --no-daemon assembleRelease bundleRelease \
            -PPWFB_KEYSTORE_FILE="$PWD/pwfb-upload-key.jks" \
            -PPWFB_KEYSTORE_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -PPWFB_KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -PPWFB_KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}"
      - name: Verify signed APK
        run: test -s android-twa/app/build/outputs/apk/release/app-release.apk
      - name: Verify signed AAB
        run: test -s android-twa/app/build/outputs/bundle/release/app-release.aab
      - name: Verify APK package and version
        run: |
          set -euo pipefail
          ${ANDROID_HOME}/build-tools/36.0.0/apksigner verify --verbose android-twa/app/build/outputs/apk/release/app-release.apk
          ${ANDROID_HOME}/build-tools/36.0.0/aapt dump badging android-twa/app/build/outputs/apk/release/app-release.apk | grep -E "package: name='com.pwfb.microfinance' versionCode='37' versionName='1.0.37'"
      - name: Upload v1.0.37 signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pwfb-microfinance-v1.0.37-passkey-jwt-fix-signed-apk
          path: android-twa/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Upload v1.0.37 signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: pwfb-microfinance-v1.0.37-passkey-jwt-fix-play-store-aab
          path: android-twa/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Generate SHA256 checksums
        run: |
          set -euo pipefail
          sha256sum android-twa/app/build/outputs/apk/release/app-release.apk > pwfb-v1.0.37-SHA256SUMS.txt
          sha256sum android-twa/app/build/outputs/bundle/release/app-release.aab >> pwfb-v1.0.37-SHA256SUMS.txt
      - name: Publish v1.0.37 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.37
          name: PWFB Microfinance v1.0.37 — Passkey JWT Fix
          body: |
            PWFB Microfinance Android application v1.0.37.

            Fixes native passkey registration failing with "jwt expired" by passing the current web login JWT directly from the authenticated WebView to the native Android Credential Manager bridge. The fresh token is also stored for subsequent native authentication flows. Expired browser tokens are detected and the user is sent back through the normal login flow.
          files: |
            android-twa/app/build/outputs/apk/release/app-release.apk
            android-twa/app/build/outputs/bundle/release/app-release.aab
            pwfb-v1.0.37-SHA256SUMS.txt
          overwrite_files: true
          make_latest: true
      - name: Delete temporary keystore
        if: always()
        run: rm -f android-twa/pwfb-upload-key.jks

# PWFB v1.0.37 — pass current web JWT to native passkey registration
