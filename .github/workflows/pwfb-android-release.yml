name: PWFB Android Release

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-twa/**'
      - '.github/workflows/pwfb-android-release.yml'

permissions:
  contents: write

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.13'

jobs:
  build-and-sign-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Restore signing keystore
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android-twa/pwfb-upload-key.jks
          chmod 600 android-twa/pwfb-upload-key.jks
      - name: Build signed APK and AAB
        working-directory: android-twa
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleRelease bundleRelease \
            -PPWFB_KEYSTORE_FILE="$PWD/pwfb-upload-key.jks" \
            -PPWFB_KEYSTORE_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -PPWFB_KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -PPWFB_KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}"
      - name: Verify version
        run: grep -q "versionCode 46" android-twa/app/build.gradle && grep -q "versionName '1.0.46'" android-twa/app/build.gradle
      - name: Verify signed APK
        run: test -s android-twa/app/build/outputs/apk/release/app-release.apk
      - name: Verify signed AAB
        run: test -s android-twa/app/build/outputs/bundle/release/app-release.aab
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pwfb-microfinance-v1.0.46-fresh-auth-signed-apk
          path: android-twa/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: pwfb-microfinance-v1.0.46-fresh-auth-signed-aab
          path: android-twa/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Publish APK and AAB release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.46
          name: PWFB Microfinance v1.0.46 — Fresh Authentication
          body: |
            PWFB Microfinance Android application v1.0.46.

            Fresh authentication structure: Google sign-in uses the native Android Google account picker and returns directly to the PWFB dashboard; fingerprint/passkey sign-in is discoverable and no longer requires an email first. After the first Google sign-in, the app immediately offers to save the device fingerprint through Android Credential Manager so the next login can use Use fingerprint directly.
            Signed APK is provided for Android installation and signed AAB for Google Play.
          files: |
            android-twa/app/build/outputs/apk/release/app-release.apk
            android-twa/app/build/outputs/bundle/release/app-release.aab
          overwrite_files: true
          make_latest: true
      - name: Delete temporary keystore
        if: always()
        run: rm -f android-twa/pwfb-upload-key.jks

# PWFB v1.0.46 fresh authentication release build
