name: PWFB Android Release

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-twa/**'
      - '.github/workflows/pwfb-android-release.yml'

permissions:
  contents: write

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.13'

jobs:
  build-and-sign-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Restore signing keystore
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android-twa/pwfb-upload-key.jks
          chmod 600 android-twa/pwfb-upload-key.jks
      - name: Build signed APK and AAB
        working-directory: android-twa
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleRelease bundleRelease \
            -PPWFB_KEYSTORE_FILE="$PWD/pwfb-upload-key.jks" \
            -PPWFB_KEYSTORE_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -PPWFB_KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -PPWFB_KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}"
      - name: Verify APK package, version, alignment and signature
        run: |
          set -euo pipefail
          APK=android-twa/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.pwfb.microfinance' versionCode='29' versionName='1.0.29'"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
      - name: Verify AAB exists
        run: |
          set -euo pipefail
          test -s android-twa/app/build/outputs/bundle/release/app-release.aab
      - name: Generate release checksums
        run: |
          set -euo pipefail
          sha256sum android-twa/app/build/outputs/apk/release/app-release.apk android-twa/app/build/outputs/bundle/release/app-release.aab > android-twa/pwfb-v1.0.29-SHA256SUMS.txt
          cat android-twa/pwfb-v1.0.29-SHA256SUMS.txt
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pwfb-microfinance-v1.0.29-native-auth-signed-apk
          path: android-twa/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: pwfb-microfinance-v1.0.29-play-store-signed-aab
          path: android-twa/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Upload release checksums
        uses: actions/upload-artifact@v4
        with:
          name: pwfb-microfinance-v1.0.29-checksums
          path: android-twa/pwfb-v1.0.29-SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish APK, AAB and checksums
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.29
          name: PWFB Microfinance v1.0.29
          body: |
            PWFB Microfinance Android application v1.0.29.

            Stability release based on the restored first stable PWFB Android flow.
            Native authentication remains the app entry point; successful password, Gmail or fingerprint authentication hands the current token to the current PWFB dashboard inside the app.

            The release build is cleaned before packaging and verifies the APK package/version, zip alignment and APK signature before publication.
          files: |
            android-twa/app/build/outputs/apk/release/app-release.apk
            android-twa/app/build/outputs/bundle/release/app-release.aab
            android-twa/pwfb-v1.0.29-SHA256SUMS.txt
          overwrite_files: true
          make_latest: true
      - name: Delete temporary keystore
        if: always()
        run: rm -f android-twa/pwfb-upload-key.jks

# PWFB v1.0.29 stable Android release
