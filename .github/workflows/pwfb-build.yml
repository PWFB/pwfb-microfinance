name: PWFB Microfinance CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Prisma schema
        run: npm run prisma:validate
      - name: Verify migration status
        run: npm exec --workspace=backend -- prisma migrate status --schema=prisma/schema.prisma
      - name: Check Prisma formatting
        run: npm run prisma:format:check
      - name: Build backend and frontend
        run: npm run build
      - name: Run backend and frontend tests
        run: npm test
      - name: Build backend Docker image
        run: docker build -f docker/Dockerfile.backend -t pwfb-backend:ci .
