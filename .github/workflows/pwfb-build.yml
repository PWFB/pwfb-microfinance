name: PWFB Microfinance Build

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DATABASE_URL: postgresql://pwfb_ci:pwfb_ci@localhost:5432/pwfb_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm install --no-audit --no-fund

      - name: Apply compatible dependency security updates
        run: |
          npm audit fix --no-fund --no-force || echo "Some advisories require major-version changes; continuing to run tests and report remaining findings."
          npm ls next sharp @nestjs/platform-express body-parser brace-expansion fast-uri handlebars js-yaml multer nanoid postcss prisma proxy-addr qs source-map-js --all || true

      - name: Report dependency audit findings
        if: always()
        run: |
          npm audit --json > /tmp/pwfb-npm-audit.json || true
          node <<'NODE'
          const fs = require('node:fs');
          let report = {};
          try { report = JSON.parse(fs.readFileSync('/tmp/pwfb-npm-audit.json', 'utf8')); } catch { console.log('npm audit did not return parseable JSON'); process.exit(0); }
          const counts = report.metadata?.vulnerabilities || {};
          console.log('Dependency audit counts:', JSON.stringify(counts));
          for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
            console.log(`AUDIT ${String(item.severity || 'unknown').toUpperCase()} ${name} range=${item.range || 'unknown'} fixAvailable=${JSON.stringify(item.fixAvailable ?? null)}`);
            for (const via of (item.via || [])) {
              if (typeof via === 'object') console.log(`  ADVISORY ${via.title || via.name || 'unknown'} ${via.url || ''}`);
            }
          }
          NODE

      - name: Upload refreshed dependency lockfile for review
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@v4
        with:
          name: pwfb-package-lock-${{ github.sha }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3

      - name: Validate Prisma schema
        run: npx prisma validate --schema=apps/backend/prisma/schema.prisma

      - name: Build backend
        run: npm run build:pwfb

      - name: Test backend
        run: npm run test --workspace=backend -- --runInBand

      - name: Test frontend
        run: npm run test --workspace=pwfb-frontend

      - name: Build frontend
        run: npm run build:frontend

      - name: Build backend Docker image
        run: |
          IMAGE_NAME=ghcr.io/pwfb/pwfb-microfinance/backend:${{ github.sha }}
          docker build -f docker/Dockerfile.backend -t "$IMAGE_NAME" .

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push backend Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE_NAME=ghcr.io/pwfb/pwfb-microfinance/backend:${{ github.sha }}
          docker push "$IMAGE_NAME"
