name: PWFB Microfinance Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DATABASE_URL: postgresql://pwfb_ci:pwfb_ci@localhost:5432/pwfb_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate --schema=apps/backend/prisma/schema.prisma

      - name: Build backend
        run: npm run build:pwfb

      - name: Test backend
        run: npm run test --workspace=backend -- --runInBand

      - name: Test frontend
        run: npm run test --workspace=pwfb-frontend

      - name: Build frontend
        run: npm run build:frontend

      - name: Build backend Docker image
        run: |
          IMAGE_NAME=ghcr.io/pwfb/pwfb-microfinance/backend:${{ github.sha }}
          docker build -f docker/Dockerfile.backend -t "$IMAGE_NAME" .

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push backend Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE_NAME=ghcr.io/pwfb/pwfb-microfinance/backend:${{ github.sha }}
          docker push "$IMAGE_NAME"
