name: Repair Collection Schema

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore schema from known good commit and add settlement fields
        run: |
          git show c956fdf454e1d0a44d7060187bba10cbf2d41503:apps/backend/prisma/schema.prisma > apps/backend/prisma/schema.prisma
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/backend/prisma/schema.prisma')
          s = p.read_text()
          old = '  reconciled Boolean @default(false)\n  createdAt DateTime @default(now())'
          new = '  reconciled Boolean @default(false)\n  settled Boolean @default(false)\n  settledAt DateTime?\n  settlementTransactionId String?\n  settlementRecordId String?\n  createdAt DateTime @default(now())'
          if old not in s:
              raise SystemExit('DailyCollection schema anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
          npx prisma format --schema=apps/backend/prisma/schema.prisma
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/backend/prisma/schema.prisma
          git commit -m 'fix(collections): restore schema and add settlement tracking'
          git push

      - name: Remove repair workflow
        run: |
          git rm .github/workflows/repair-collection-schema.yml
          git commit -m 'chore: remove one-time collection schema repair workflow'
          git push
