plugins { id 'com.android.application' }

android {
    namespace 'com.pwfb.microfinance'
    compileSdk 36

    defaultConfig {
        applicationId 'com.pwfb.microfinance'
        minSdk 23
        targetSdk 36
        versionCode 13
        versionName '1.0.12'
    }

    signingConfigs {
        release {
            if (project.hasProperty('PWFB_KEYSTORE_FILE')) {
                storeFile file(project.property('PWFB_KEYSTORE_FILE'))
                storePassword project.property('PWFB_KEYSTORE_PASSWORD')
                keyAlias project.property('PWFB_KEY_ALIAS')
                keyPassword project.property('PWFB_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    resolutionStrategy { force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22' }
}

dependencies {
    implementation 'androidx.browser:browser:1.9.0'
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
}
