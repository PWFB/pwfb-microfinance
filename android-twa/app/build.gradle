plugins { id 'com.android.application' }

android {
    namespace 'com.pwfb.microfinance'
    compileSdk 36

    defaultConfig {
        applicationId 'com.pwfb.microfinance'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.browser:browser:1.9.0'
}
