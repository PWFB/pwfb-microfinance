services:
  - type: web
    name: pwfb-backend
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: npm install && npm run build --workspace=backend
    startCommand: npm run start:prod --workspace=backend
    healthCheckPath: /health
    autoDeploy: true

  - type: web
    name: pwfb-frontend
    runtime: node
    plan: starter
    rootDir: apps/frontend
    # Ensure devDependencies are installed during build (Tailwind/PostCSS needed by Next build)
    buildCommand: NPM_CONFIG_PRODUCTION=false npm install && npm run build
    startCommand: npm run start
    autoDeploy: true
